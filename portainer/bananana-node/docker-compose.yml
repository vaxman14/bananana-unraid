# The bananana agent (bananana-node) for Portainer stack templates. On your brain, open Nodes > Add node >
# Install command > Docker and put the code in BANANANA_NODE_TOKEN (it's only used on the first start).
# It sees and manages the host (processes, disks, Docker, files, terminal), so it needs the host's namespaces.
services:
  bananana-node:
    image: romanvaxman/bananana-node:2026.11.5
    container_name: bananana-node
    restart: unless-stopped
    privileged: true
    pid: host
    network_mode: host
    uts: host
    environment:
      BANANANA_NODE_TOKEN: ${BANANANA_NODE_TOKEN:-}
      BANANANA_NODE_NAME: ${BANANANA_NODE_NAME:-}
    volumes:
      - bananana-node:/data
volumes:
  bananana-node:
